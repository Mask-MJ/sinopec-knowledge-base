# 目标机器自行 git pull 并构建，runner 只当触发器。
#
# 为什么不在 runner 上构建再传镜像：镜像 1.58GB，其中 node_modules 层就占
# 851MB，而每次代码改动真正变化的只有十几 MB。试过 GHCR，实测目标机器只有
# 35KB/s（本机 tailnet 直传是 4.3MB/s），拉一次要 6 小时。
#
# 目标机器拉代码只要几秒（部分克隆），且 docker 层缓存会让 pnpm install 在
# 依赖未变时直接命中，只重新编译前后端。构建用 nice 降优先级，避免抢占同机
# 运行的 RAGFlow / ES / MySQL。
#
# 依赖控制：不使用任何第三方 action。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的分支或 tag
        required: false
        default: main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 部署到目标机器
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_REF: ${{ github.event.inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 构建期间输出有间隔，ServerAlive 是协议层心跳，防中间设备掐断
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=20 -o ServerAliveCountMax=90 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              bash -euo pipefail -s -- "$DEPLOY_REF" <<'REMOTE'
          REF="$1"
          cd /opt/sinopec-kb-src

          git fetch --prune origin
          git reset --hard "origin/$REF"
          echo "已切到 $(git rev-parse --short HEAD) ($REF)"

          # 留回滚点：现役镜像另打一个 tag，健康检查失败时切回去
          docker tag sinopec-kb-app:latest sinopec-kb-app:rollback 2>/dev/null || true

          # nice 降优先级：这台机器同时跑着 RAGFlow / ES / MySQL
          nice -n 10 docker compose -p sinopec-kb build app

          docker compose -p sinopec-kb up -d app

          # entrypoint 会先跑 prisma migrate deploy 再启动，等 healthcheck 转绿
          for _ in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Health.Status}}' sinopec-kb-app 2>/dev/null || echo starting)
            [ "$st" = healthy ] && break
            sleep 5
          done

          if [ "${st:-}" != healthy ]; then
            echo "::error::健康检查未通过（状态=${st:-unknown}），回滚到上一版本"
            docker logs --tail 50 sinopec-kb-app || true
            if docker image inspect sinopec-kb-app:rollback >/dev/null 2>&1; then
              docker tag sinopec-kb-app:rollback sinopec-kb-app:latest
              docker compose -p sinopec-kb up -d app
            fi
            exit 1
          fi

          echo "部署成功：$(git rev-parse --short HEAD)"
          docker image prune -f --filter 'until=168h' || true
          REMOTE

      - name: 清理密钥
        if: always()
        run: rm -f ~/.ssh/deploy_key
